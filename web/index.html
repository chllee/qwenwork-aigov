<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kagi 鍵 — what your AI did</title>
<style>
:root{--bg:#0e1013;--panel:#161a20;--line:#242b34;--tx:#e6e9ee;--dim:#8b97a7;--ok:#3ecf8e;--warn:#f2b544;--bad:#ff5d5d;--accent:#7aa2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line);background:#12151a;position:sticky;top:0;z-index:5}
h1{font-size:15px;margin:0;letter-spacing:.04em;text-transform:uppercase}h1 span{color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0}
nav{display:flex;gap:4px;margin-left:auto}button{font:inherit;cursor:pointer}
nav button{background:none;border:1px solid transparent;color:var(--dim);padding:6px 12px;border-radius:7px}
nav button.on{color:var(--tx);border-color:var(--line);background:var(--panel)}
main{padding:22px;max-width:1180px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card b{display:block;font-size:26px;font-weight:640}.card span{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.brif{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;max-width:760px}
.brif .head{font-size:19px;font-weight:620;margin-bottom:14px}
.brif li{list-style:none;margin:0 0 11px;padding-left:16px;position:relative}
.brif li:before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--dim)}
.brif li.stop:before{background:var(--bad)}.brif li.wait:before{background:var(--warn)}.brif li.ok:before{background:var(--ok)}
.who{color:var(--accent);font-weight:600}
script60{display:block;margin-top:18px;padding:14px 16px;border-left:2px solid var(--accent);background:#12151a;color:#c9d3e0;font-size:14px;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;color:var(--dim);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #1c222a;vertical-align:top}
tr:hover td{background:#181d24}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:650;letter-spacing:.03em;white-space:nowrap}
.ALLOW,.EXECUTED{color:var(--ok);background:#12291f}.HOLD_FOR_APPROVAL,.waiting{color:var(--warn);background:#2a2213}.BLOCK,.DENIED{color:var(--bad);background:#2b1618}.note{color:var(--dim);background:#1a1f26}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#b8c4d4}
.ev{margin:4px 0 0;padding:0}li.evli{list-style:none;font-size:12.5px;color:var(--dim)}
.evli b{color:#c9d3e0;font-weight:500}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.act{background:var(--panel);border:1px solid var(--line);color:var(--tx);padding:8px 14px;border-radius:8px}
.act:hover{border-color:var(--accent)}.act.good{color:var(--ok)}.act.bad{color:var(--bad)}
.bar{height:4px;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad));border-radius:3px;margin:0 0 18px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.dim{color:var(--dim)}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 12px}
</style></head><body>
<header><h1>Kagi <span>· 鍵 · the key your agents must turn</span></h1>
<nav><button data-v="brif" class="on">This morning</button><button data-v="wait">Needs you</button><button data-v="ledg">Run ledger</button><button data-v="int">Integrity</button></nav></header>
<main>
<div class="bar"></div>
<div class="cards" id="cards"></div>
<div id="view"></div>
</main>
<script>
const $=(s)=>document.querySelector(s), views={};
const esc=(s)=>String(s??'').replace(/[&<>]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const get=(u)=>fetch(u).then(r=>r.json());
const post=(u,b)=>fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());

async function summary(){
  const s=await get('/api/summary');const c=s.counts;
  $$('#cards').forEach&&0;
  document.getElementById('cards').innerHTML=[
    [c.actions,'actions judged'],[c.allowed,'allowed'],[c.held,'waiting on you'],
    [c.blocked,'stopped'],[c.findings,'findings logged'],[c.ledger_rows,'ledger rows']
  ].map(([n,l])=>`<div class="card"><b>${n}</b><span>${l}</span></div>`).join('')+
  `<div class="card"><b class="dim" style="font-size:14px">policy v${s.policy.version}</b><span>${s.policy.rules} rules · ${c.obligations} obligations mined from prose</span></div>`;
  return s;
}

views.brif=async()=>{
  const b=await get('/api/briefing');
  document.getElementById('view').innerHTML=`<div class="brif"><div class="head">${esc(b.headline)}</div><ul>${
    b.lines.slice(1).map(l=>{
      const cls=l.who==='summary'?'ok':/stopped|tried|wanted|told|offered|refused|mentioned/i.test(l.text)?'stop':/waiting|held|due/i.test(l.text)?'wait':'ok';
      const who=['headline','summary','oversight','mei.tan'].includes(l.who)?'':`<span class="who">${esc(l.who)}</span> `;
      return `<li class="${cls}">${who}${esc(l.text)}</li>`}).join('')}</ul>
    <script60><b>60-second version · ${b.script.words} words ≈ ${b.script.seconds}s</b>\n${esc(b.script.text)}</script60></div>`;
};

views.wait=async()=>{
  const p=await get('/api/pending');
  document.getElementById('view').innerHTML=p.length?'':`<div class="pane ok">Nothing is waiting on you. That is the normal state, and it is auditable.</div>`;
  p.forEach(x=>{
    const d=document.createElement('div');d.className='pane';
    d.innerHTML=`<div class="row"><span class="chip HOLD_FOR_APPROVAL">needs you</span><b>${esc(x.action)}</b>
      <span class="dim mono">#${x.seq} · ${esc(x.ts)}</span></div>
      <div class="dim" style="margin-bottom:10px">${esc((x.reason||'').split('|').join(' · '))}</div>
      ${(x.evidence||[]).map(e=>`<li class="evli">↳ <b>${esc(e.path.split('/').pop())}${e.locator?' '+e.locator:''}</b> ${e.redacted?'<span class="bad">[quote withheld: regulated]</span>':'“'+esc((e.quote||'').slice(0,120))+'”'}</li>`).join('')}
      <div class="row" style="margin-top:14px">
        <button class="act good" onclick="decide(${x.seq},'allow','owner released')">Allow this one</button>
        <button class="act bad" onclick="decide(${x.seq},'deny','owner denied')">Deny</button>
        <span class="dim" style="font-size:12px">scoped to this action only · no answer by the deadline is a no</span></div>`;
    document.getElementById('view').appendChild(d);
  });
};
window.decide=async(seq,v,note)=>{await post('/api/decide',{seq,verdict:v,note});render();};

views.ledg=async()=>{
  const r=await get('/api/run_ledger');
  document.getElementById('view').innerHTML=`<div class="pane"><h2>Every attempt, allowed or not</h2><table><tr><th>#</th><th>who</th><th>action</th><th>data</th><th>verdict</th><th>rules</th><th>what it means</th></tr>${
    r.map(e=>`<tr><td class="dim mono">${e.seq}</td><td class="mono">${esc(e.actor)}</td><td class="mono">${esc(e.action??e.kind)}</td>
      <td class="dim">${esc(e.data_level??'')}</td><td><span class="chip ${e.decision??'note'}">${esc(e.decision??e.kind)}</span></td>
      <td class="mono">${(e.rules??[]).join(' + ')}</td><td class="dim">${esc((e.reason||'').slice(0,190))}
      ${(e.evidence||[]).length?`<ul>${e.evidence.map(x=>`<li class="evli">↳ <b>${esc(String(x.path).split('/').pop())}${x.locator?' '+x.locator:''}</b></li>`).join('')}</ul>`:''}</td></tr>`).join('')}</table></div>
    <div class="row"><button class="act" onclick="replay()">Replay the rogue-agent pack</button><span class="dim" style="font-size:12px">re-runs all five AvePoint scenarios plus our own two, end to end</span></div><div id="rep"></div>`;
};
window.replay=async()=>{const r=await post('/api/replay');document.getElementById('rep').innerHTML=
  `<div class="pane"><h2>Self-score, their rubric: right decision / right rule / evidence cited</h2>
   <p style="font-size:17px" class="${r.kit===r.of?'ok':'bad'}">AvePoint's five: ${r.kit}/${r.of}${r.kit===r.of?' — zero missed violations':''}</p>
   <table><tr><th></th><th>decision</th><th>rules</th><th>evidence</th></tr>${r.results.map(x=>`<tr><td><b>${x.id}</b> ${esc(x.name)}${x.our_own?' <span class="chip note">ours</span>':''}</td>
    <td class="${x.decision.ok?'ok':'bad'}">${x.decision.ok?'pass':'got '+x.decision.got}</td>
    <td class="${x.rules.ok?'ok':'bad'}">${x.rules.ok?'pass':'missing '+x.rules.miss}</td>
    <td class="${x.evidence.ok?'ok':'bad'}">${x.evidence.ok?'pass':'files '+x.evidence.paths}</td></tr>`).join('')}</table></div>`;
  summary();};

views.int=async()=>{
  const i=await get('/api/integrity');
  document.getElementById('view').innerHTML=`<div class="pane"><h2>Ledger integrity</h2>
    <p class="${i.ok?'ok':'bad'}" style="font-size:17px">${i.ok?`chain verified across ${i.checked} events`:`BROKEN at event ${i.brokenAt}: ${esc(i.why)}`}</p>
    <p class="dim">head hash <code>${esc(i.head)}…</code> · guard: <code>${esc((i.permissions||''))}</code> · triggers: <code>${esc((i.rules||[]).join(', '))}</code></p>
    <p style="font-size:13.5px;color:#c9d3e0">The ledger is one append-only, hash-chained table. Each row's hash covers the previous row's hash, so an edit or a deletion is detectable rather than silent — and regulated text is never copied into it at all.</p>
    <div class="row" style="margin-top:14px"><button class="act bad" onclick="tamper()">Try to forge a verdict</button><button class="act" onclick="sweep()">Simulate an unanswered deadline</button><span class="dim" style="font-size:12px">default-deny on timeout</span></div><div id="tr"></div></div>`;
};
window.tamper=async()=>{const r=await post('/api/tamper');document.getElementById('tr').innerHTML=
  `<table><tr><th>attempt</th><th>result</th></tr>${r.tries.map(t=>`<tr><td>${esc(t.attempt)}</td><td class="${/REFUSED/.test(t.result)?'ok':'bad'}">${esc(t.result)}</td></tr>`).join('')}</table>
   <p class="${r.chain.ok?'ok':'bad'}">after the attempts: ${r.chain.ok?'chain still verified':`chain check caught it at event ${r.chain.brokenAt} — ${esc(r.chain.why)}`}</p>
   <p class="dim" style="font-size:12.5px">${esc(r.note)}</p>`; summary();};
window.sweep=async()=>{const r=await post('/api/timeout_sweep',{maxAgeMinutes:0});document.getElementById('tr').innerHTML+=`<p class="dim">deadline passed with no answer → ${r.denied.length} action(s) recorded as denied by default (ledger rows ${r.denied.join(', ')})</p>`;summary();};

const $$=(s)=>[...document.querySelectorAll(s)];
let cur='brif';
async function render(){await summary();document.getElementById('view').innerHTML='';await views[cur]();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{cur=b.dataset.v;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render();});
render();
</script></body></html>
